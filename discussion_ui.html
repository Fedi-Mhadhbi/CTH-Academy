<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Discussion</title>
<style>
.discussion-section {
    max-width: 900px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.discussion-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e0e0e0;
}

.discussion-header h2 {
    color: #4b7bec;
    font-size: 28px;
}

.ask-question-btn {
    background: #4b7bec;
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.ask-question-btn:hover {
    background: #3a5fcc;
    transform: translateY(-2px);
}

.question-form {
    background: #f8f9fa;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 30px;
    display: none;
}

.question-form.active {
    display: block;
}

.question-form textarea {
    width: 100%;
    min-height: 120px;
    padding: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    resize: vertical;
}

.question-form textarea:focus {
    outline: none;
    border-color: #4b7bec;
}

.form-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.submit-btn, .cancel-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
}

.submit-btn {
    background: #4CAF50;
    color: white;
}

.submit-btn:hover {
    background: #45a049;
}

.cancel-btn {
    background: #e0e0e0;
    color: #666;
}

.cancel-btn:hover {
    background: #d0d0d0;
}

.discussion-item {
    background: white;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
    transition: all 0.3s;
}

.discussion-item:hover {
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transform: translateY(-2px);
}

.discussion-item.answered {
    border-color: #4CAF50;
    background: #f1f8f4;
}

.discussion-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.author-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.author-avatar {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 18px;
}

.author-name {
    font-weight: bold;
    color: #2c3e50;
}

.discussion-time {
    color: #7f8c8d;
    font-size: 14px;
}

.question-text {
    font-size: 16px;
    color: #2c3e50;
    line-height: 1.6;
    margin-bottom: 15px;
}

.discussion-footer {
    display: flex;
    gap: 15px;
    padding-top: 10px;
    border-top: 1px solid #e0e0e0;
}

.discussion-footer button {
    background: none;
    border: none;
    color: #7f8c8d;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.3s;
}

.discussion-footer button:hover {
    color: #4b7bec;
}

.answered-badge {
    background: #4CAF50;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.reply-count {
    background: #e0e0e0;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.no-discussions {
    text-align: center;
    padding: 60px 20px;
    color: #999;
}

.no-discussions-icon {
    font-size: 64px;
    margin-bottom: 20px;
}

/* Reply Modal */
.reply-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.reply-modal.active {
    display: flex;
}

.reply-modal-content {
    background: white;
    border-radius: 15px;
    max-width: 700px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 30px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.close-modal {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #999;
}

.original-question {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.reply-item {
    border-left: 3px solid #e0e0e0;
    padding: 15px;
    margin-bottom: 15px;
}

.reply-item.teacher-reply {
    border-left-color: #4b7bec;
    background: #f0f4ff;
}

.reply-text {
    color: #2c3e50;
    line-height: 1.6;
    margin-top: 10px;
}

.teacher-badge {
    background: #4b7bec;
    color: white;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
    margin-left: 10px;
}

.helpful-btn {
    background: none;
    border: 1px solid #4CAF50;
    color: #4CAF50;
    padding: 5px 12px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 12px;
    margin-top: 10px;
    transition: all 0.3s;
}

.helpful-btn:hover {
    background: #4CAF50;
    color: white;
}

@media (max-width: 768px) {
    .discussion-section {
        padding: 15px;
        margin: 20px 10px;
    }
    
    .discussion-header {
        flex-direction: column;
        gap: 15px;
    }
    
    .ask-question-btn {
        width: 100%;
    }
}
</style>
</head>
<body>

<div class="discussion-section" id="discussionSection">
    <div class="discussion-header">
        <h2>💬 Course Discussion</h2>
        <button class="ask-question-btn" onclick="toggleQuestionForm()">Ask a Question</button>
    </div>

    <!-- Question Form -->
    <div class="question-form" id="questionForm">
        <h3 style="margin-bottom: 15px;">Ask Your Question</h3>
        <textarea id="questionInput" placeholder="Type your question here..."></textarea>
        <div class="form-buttons">
            <button class="submit-btn" onclick="postQuestion()">Post Question</button>
            <button class="cancel-btn" onclick="toggleQuestionForm()">Cancel</button>
        </div>
    </div>

    <!-- Discussions List -->
    <div id="discussionsList">
        <div class="no-discussions">
            <div class="no-discussions-icon">💭</div>
            <p>Loading discussions...</p>
        </div>
    </div>
</div>

<!-- Reply Modal -->
<div class="reply-modal" id="replyModal">
    <div class="reply-modal-content">
        <div class="modal-header">
            <h3>Discussion Replies</h3>
            <button class="close-modal" onclick="closeReplyModal()">×</button>
        </div>
        
        <div class="original-question" id="modalQuestion"></div>
        
        <div id="repliesList"></div>
        
        <div class="question-form active" style="margin-top: 25px;">
            <h4 style="margin-bottom: 15px;">Your Reply</h4>
            <textarea id="replyInput" placeholder="Type your reply..."></textarea>
            <div class="form-buttons">
                <button class="submit-btn" onclick="postReply()">Post Reply</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentCourseId = 1; // This should be set dynamically
let currentDiscussionId = null;

function toggleQuestionForm() {
    const form = document.getElementById('questionForm');
    form.classList.toggle('active');
    if (form.classList.contains('active')) {
        document.getElementById('questionInput').focus();
    }
}

async function loadDiscussions() {
    try {
        const res = await fetch(`backend/discussions/get_discussions.php?course_id=${currentCourseId}`);
        const data = await res.json();
        
        const container = document.getElementById('discussionsList');
        
        if (data.status === 'error') {
            container.innerHTML = `<div class="no-discussions"><p>Error: ${data.message}</p></div>`;
            return;
        }
        
        if (data.discussions.length === 0) {
            container.innerHTML = `
                <div class="no-discussions">
                    <div class="no-discussions-icon">💭</div>
                    <p>No questions yet. Be the first to ask!</p>
                </div>`;
            return;
        }
        
        let html = '';
        data.discussions.forEach(d => {
            const initials = (d.prenom.charAt(0) + d.nom.charAt(0)).toUpperCase();
            const answeredClass = d.is_answered == 1 ? 'answered' : '';
            const answeredBadge = d.is_answered == 1 ? '<span class="answered-badge">✓ Answered</span>' : '';
            
            html += `
                <div class="discussion-item ${answeredClass}">
                    <div class="discussion-meta">
                        <div class="author-info">
                            <div class="author-avatar">${initials}</div>
                            <div>
                                <div class="author-name">${d.prenom} ${d.nom}</div>
                                <div class="discussion-time">${d.created_at}</div>
                            </div>
                        </div>
                        ${answeredBadge}
                    </div>
                    <div class="question-text">${d.question}</div>
                    <div class="discussion-footer">
                        <button onclick="viewReplies(${d.id})">
                            💬 <span class="reply-count">${d.reply_count} ${d.reply_count == 1 ? 'reply' : 'replies'}</span>
                        </button>
                    </div>
                </div>`;
        });
        
        container.innerHTML = html;
        
    } catch (err) {
        console.error(err);
        document.getElementById('discussionsList').innerHTML = 
            '<div class="no-discussions"><p>Failed to load discussions</p></div>';
    }
}

async function postQuestion() {
    const question = document.getElementById('questionInput').value.trim();
    
    if (!question) {
        alert('Please enter a question');
        return;
    }
    
    try {
        const res = await fetch('backend/discussions/post_question.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                course_id: currentCourseId,
                question: question
            })
        });
        
        const data = await res.json();
        
        if (data.status === 'success') {
            document.getElementById('questionInput').value = '';
            toggleQuestionForm();
            loadDiscussions();
            alert('✅ Question posted successfully!');
        } else {
            alert('❌ ' + data.message);
        }
    } catch (err) {
        console.error(err);
        alert('Failed to post question');
    }
}

async function viewReplies(discussionId) {
    currentDiscussionId = discussionId;
    
    try {
        const res = await fetch(`backend/discussions/get_replies.php?discussion_id=${discussionId}`);
        const data = await res.json();
        
        if (data.status === 'error') {
            alert('Error: ' + data.message);
            return;
        }
        
        // Show original question
        const questionHtml = `
            <strong>${data.discussion.prenom} ${data.discussion.nom} asked:</strong>
            <p style="margin-top: 10px;">${data.discussion.question}</p>
        `;
        document.getElementById('modalQuestion').innerHTML = questionHtml;
        
        // Show replies
        const repliesContainer = document.getElementById('repliesList');
        if (data.replies.length === 0) {
            repliesContainer.innerHTML = '<p style="text-align:center;color:#999;">No replies yet. Be the first to answer!</p>';
        } else {
            let html = '';
            data.replies.forEach(r => {
                const teacherBadge = r.is_teacher_reply == 1 ? '<span class="teacher-badge">TEACHER</span>' : '';
                const teacherClass = r.is_teacher_reply == 1 ? 'teacher-reply' : '';
                const initials = (r.prenom.charAt(0) + r.nom.charAt(0)).toUpperCase();
                
                html += `
                    <div class="reply-item ${teacherClass}">
                        <div class="author-info">
                            <div class="author-avatar" style="width:30px;height:30px;font-size:14px;">${initials}</div>
                            <div>
                                <strong>${r.prenom} ${r.nom}</strong> ${teacherBadge}
                                <div class="discussion-time">${r.created_at}</div>
                            </div>
                        </div>
                        <div class="reply-text">${r.reply}</div>
                        <button class="helpful-btn">👍 Helpful (${r.helpful_count})</button>
                    </div>`;
            });
            repliesContainer.innerHTML = html;
        }
        
        document.getElementById('replyModal').classList.add('active');
        
    } catch (err) {
        console.error(err);
        alert('Failed to load replies');
    }
}

function closeReplyModal() {
    document.getElementById('replyModal').classList.remove('active');
    document.getElementById('replyInput').value = '';
}

async function postReply() {
    const reply = document.getElementById('replyInput').value.trim();
    
    if (!reply) {
        alert('Please enter a reply');
        return;
    }
    
    try {
        const res = await fetch('backend/discussions/post_reply.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                discussion_id: currentDiscussionId,
                reply: reply
            })
        });
        
        const data = await res.json();
        
        if (data.status === 'success') {
            document.getElementById('replyInput').value = '';
            viewReplies(currentDiscussionId); // Reload replies
            loadDiscussions(); // Reload main list
            alert('✅ Reply posted successfully!');
        } else {
            alert('❌ ' + data.message);
        }
    } catch (err) {
        console.error(err);
        alert('Failed to post reply');
    }
}

// Load discussions on page load
loadDiscussions();
</script>
<script src="js/darkmode.js"></script>
</body>
</html>
